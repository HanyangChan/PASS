<text class="label" x="650" y="716">서버 추천 · 비교</text>
<path class="line" d="M435 355H375V810H360"/>
<text class="label" x="368" y="718">게스트</text>
<text x="40" y="930" font-size="16" fill="#526780">현재 상품·가격·배송은 데모 데이터입니다. 주문·결제·상품 DB 추천·오프라인 영속 큐·실시간 충돌 병합은 후속입니다.</text></svg>