<path class="line" d="M635 395V450"/>
<text class="label" x="485" y="435">HTTPS · 텍스트 / 조건 / JWT</text>
<path class="line" d="M835 185H955"/>
<text class="label" x="870" y="173">로그인</text>
<path class="line" d="M835 330H920V445H955"/>
<text class="label" x="935" y="351">앱이 직접 기록 저장 · RLS</text>
